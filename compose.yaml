# Every setting lives in .env; see .env.example.
services:
  bohemarr:
    build: .
    image: bohemarr:local
    init: false
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PUBLISH_PORT:-8787}:8787"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://bohemarr:8787}
      TZ: ${TZ:-Europe/Prague}
      DOWNLOADS_DIR: ${DOWNLOADS_DIR:-/downloads}
    volumes:
      - config:/config
      # Sonarr and Radarr must see the downloads at the same path, DOWNLOADS_DIR, for imports and hardlinks.
      - ${DOWNLOADS_PATH:-./downloads}:${DOWNLOADS_DIR:-/downloads}
    networks:
      - media
    stop_grace_period: 30s

volumes:
  config:

networks:
  media:
    name: bohemarr
